services:
  - type: web
    name: rag-neural-backend
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt && python index_kb.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: OPENROUTER_API_KEY
        sync: false
